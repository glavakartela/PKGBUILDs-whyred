# whyred / SDM660 ALSA routing (mainline)
# Install to /etc/alsa/conf.d/50-whyred.conf
#
# The mixer state (TAS2557 + LPASS route) is restored separately by
# alsa-restore.service from /var/lib/alsa/asound.state.
#
# Named PCM: use with `aplay -D whyred ...` / `arecord -D whyred ...`
# without changing the system default.

pcm.whyred {
    type asym
    playback.pcm "hw:0,0"   # MultiMedia1 (PRI_MI2S_RX -> TAS2557)
    capture.pcm  "hw:0,1"   # MultiMedia2 (LPI_MI2S_TX_3 -> mic)
}

ctl.whyred {
    type hw
    card 0
}

# If you want ALSA apps that use "default" to hit this card too,
# uncomment the following (may affect PipeWire/desktop):
#
#pcm.!default {
#    type asym
#    playback.pcm "hw:0,0"
#    capture.pcm  "hw:0,1"
#}
