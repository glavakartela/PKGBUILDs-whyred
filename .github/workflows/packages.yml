name: build packages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every package, even if the repository already has it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whyred-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      packages: ${{ steps.update.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-update package commits
        id: update
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          ./scripts/autoupdate.sh --push
          after="$(git rev-parse HEAD)"

          changed=""
          if [ "$before" != "$after" ]; then
            changed="$(git diff --name-only "$before" "$after" |
              awk -F/ '$2 == "PKGBUILD" { print $1 }' |
              sort -u | tr '\n' ' ')"
          fi

          event_before="${{ github.event.before }}"
          if [ -n "$event_before" ] &&
             [ "$event_before" != "0000000000000000000000000000000000000000" ]; then
            push_changed="$(git diff --name-only "$event_before" "$after" 2>/dev/null |
              awk -F/ '$2 == "PKGBUILD" { print $1 }' |
              sort -u | tr '\n' ' ' || true)"
            changed="$changed $push_changed"
          fi

          changed="$(printf '%s\n' $changed | sort -u | tr '\n' ' ')"
          echo "packages=$changed" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [update]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container:
      image: menci/archlinuxarm:latest
      options: --privileged
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Prepare Arch ARM builder
        run: |
          pacman-key --init >/dev/null 2>&1 || true
          pacman-key --populate archlinuxarm >/dev/null 2>&1 || true
          printf '%s\n' '[whyred]' 'SigLevel = Optional' 'Server = https://glavakartela.github.io/whyred-alarm/repo/' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed base-devel git sudo shadow mkinitcpio
          id builder >/dev/null 2>&1 || useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Build changed or missing packages
        id: build
        shell: bash
        run: |
          set -euo pipefail
          args=(--changed "${{ needs.update.outputs.packages }}"
                --artifacts "$GITHUB_WORKSPACE/artifacts")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "${{ inputs.force_all }}" = "true" ]; then
            args+=(--force-all)
          fi
          bash scripts/ci-build.sh "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: whyred-packages
          path: artifacts/
          if-no-files-found: ignore

  publish:
    needs: [build]
    if: needs.build.outputs.built != '0' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: whyred-packages
          path: pkgs
      - name: Publish to whyred-alarm
        env:
          TOKEN: ${{ secrets.WHYRED_ALARM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "missing repository secret WHYRED_ALARM_TOKEN" >&2
            exit 1
          fi
          pacman -Syu --noconfirm --needed git libarchive pacman
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/glavakartela/whyred-alarm.git" repo
          cd repo
          shopt -s nullglob
          for p in ../pkgs/*.pkg.tar.*; do
            if ! bsdtar -tf "$p" >/dev/null 2>&1; then
              echo "corrupt package artifact: $p" >&2
              exit 1
            fi
            pkgname="$(bsdtar -xOf "$p" .PKGINFO | awk -F' = ' '/^pkgname = /{print $2}')"
            rm -f repo/"${pkgname}-"*.pkg.tar.*
            cp "$p" repo/
            repo-add -p -R repo/whyred.db.tar.gz "repo/$(basename "$p")"
          done
          rm -f repo/*.old
          git config user.name "Kulesha Evgeniy"
          git config user.email "voovdop@gmail.com"
          git add repo
          if git diff --cached --quiet; then
            echo "no package changes"
            exit 0
          fi
          git commit -m "CI: update packages" -m "Signed-off-by: Kulesha Evgeniy <voovdop@gmail.com>"
          git push origin main
