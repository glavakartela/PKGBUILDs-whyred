name: build packages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whyred-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-update package commits
        id: update
        run: |
          before="$(git rev-parse HEAD)"
          ./scripts/autoupdate.sh --push
          after="$(git rev-parse HEAD)"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: update
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container:
      image: menci/archlinuxarm:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        package:
          - sdm660-linux
          - sdm660-linux-whyred
          - sdm660-mesa-a5xx
          - sdm660-libcamera
          - sdm660-venus
          - sdm660-audio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare Arch ARM builder
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo
          id builder >/dev/null 2>&1 || useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Build ${{ matrix.package }}
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE/${{ matrix.package }}' && makepkg -s --noconfirm --needed"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}
          path: ${{ matrix.package }}/*.pkg.tar.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: pkgs
      - name: Publish to whyred-alarm
        env:
          TOKEN: ${{ secrets.WHYRED_ALARM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "missing repository secret WHYRED_ALARM_TOKEN" >&2
            exit 1
          fi
          pacman -Syu --noconfirm --needed git libarchive pacman
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/glavakartela/whyred-alarm.git" repo
          cd repo
          shopt -s nullglob
          for p in ../pkgs/*.pkg.tar.*; do
            pkgname="$(bsdtar -xOf "$p" .PKGINFO | awk -F' = ' '/^pkgname = /{print $2}')"
            rm -f repo/"${pkgname}-"*.pkg.tar.*
            cp "$p" repo/
            repo-add -R repo/whyred.db.tar.gz "repo/$(basename "$p")"
          done
          git config user.name "Kulesha Evgeniy"
          git config user.email "voovdop@gmail.com"
          git add repo
          if git diff --cached --quiet; then
            echo "no package changes"
            exit 0
          fi
          git commit -m "CI: update packages

Signed-off-by: Kulesha Evgeniy <voovdop@gmail.com>"
          git push origin main
