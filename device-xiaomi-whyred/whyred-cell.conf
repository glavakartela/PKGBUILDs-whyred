# whyred cellular fallback configuration.
# APN used for the LTE bearer.  Leave empty to use the modem's initial
# bearer APN, then the mobile-broadband-provider-info database.
APN=
# Optional credentials for carriers that require them.
APN_USER=
APN_PASS=
# Interface created by ModemManager for the QMAP mux.
DEV=qmapmux0.0
# Route metric for the LTE default.  Wi-Fi uses 600, so LTE is only used
# when no Wi-Fi default route exists.
METRIC=700
# Re-check period in seconds.
POLL=10
# Delay before retrying a missing modem/bearer.
RETRY=30
