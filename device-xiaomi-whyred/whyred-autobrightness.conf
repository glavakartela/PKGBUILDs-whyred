# Set ENABLED=0 or stop whyred-autobrightness.service to keep a manual level.
# The ALS is sampled SAMPLE_COUNT times; the median must stay stable for
# HOLD_SECS before the panel moves.  MAX_STEP bounds one update; FADE_MS
# controls the hardware fade.
# USE_KDE_BRIGHTNESS=0 avoids a feedback loop with the Plasma brightness
# slider (the slider still shows the level KDE itself applied).
ENABLED=1
MIN_BRIGHTNESS=300
MAX_BRIGHTNESS=4095
INTERVAL=2
SAMPLE_COUNT=3
SAMPLE_DELAY=0.2
HOLD_SECS=2
CURVE_DIVISOR=3.2
USE_KDE_BRIGHTNESS=0
FADE_MS=700
MIN_DELTA=40
MAX_STEP=800
SYNC_DELTA=200
