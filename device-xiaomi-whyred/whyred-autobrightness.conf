# Set ENABLED=0 or stop whyred-autobrightness.service to keep a manual level.
# USE_KDE_BRIGHTNESS=1 syncs the final value with the Plasma brightness slider.
# FADE_MS controls the smooth hardware fade duration.
# MIN_DELTA suppresses tiny light fluctuations; SYNC_DELTA suppresses tiny slider updates.
ENABLED=1
MIN_BRIGHTNESS=300
MAX_BRIGHTNESS=4095
INTERVAL=3
CURVE_DIVISOR=3.2
USE_KDE_BRIGHTNESS=1
FADE_MS=800
MIN_DELTA=30
SYNC_DELTA=20
