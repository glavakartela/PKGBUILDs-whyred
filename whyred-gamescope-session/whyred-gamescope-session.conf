# whyred-gamescope-session configuration.
#
# This file is sourced by /bin/sh, so quote values containing spaces.
# User overrides go to ~/.config/whyred-gamescope-session.conf.

# Command launched inside Gamescope.  If unset, the session picks
# "retroarch --menu", then "moonlight-qt", then a warning screen.
#
# Examples:
#   GAMESCOPE_SESSION_APP="env SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=opengl retroarch --appendconfig /usr/share/whyred-gamescope-session/retroarch-gamescope.cfg --menu"
#   GAMESCOPE_SESSION_APP="moonlight-qt"
#   GAMESCOPE_SESSION_APP="steam -gamepadui"   # x86 Steam under box64, experimental
#GAMESCOPE_SESSION_APP="retroarch --menu"

# DRM session only: rotate the internal panel.  "left" gives a landscape
# 2160x1080 output from the phone's 1080x2160 panel; use "normal" for
# portrait, "right"/"upsidedown" for the other directions.
#GAMESCOPE_SESSION_ORIENTATION="left"

# DRM session internal resolution.  Leave both unset to use the phone's
# logical display size (panel mode divided by the KScreen scale, e.g.
# 1080x2160 / 2.25 = 480x960, rotated to 960x480 for landscape).  This
# matches the UI size in Plasma.  Set both to force a different size.
#GAMESCOPE_SESSION_WIDTH=960
#GAMESCOPE_SESSION_HEIGHT=480

# Nested launcher output size.  Leave both unset to follow the current
# Plasma output geometry automatically (the phone can be portrait or
# landscape).  Set both to force a size.
#GAMESCOPE_SESSION_NESTED_WIDTH=480
#GAMESCOPE_SESSION_NESTED_HEIGHT=960
