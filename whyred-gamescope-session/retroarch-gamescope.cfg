# RetroArch settings for running inside Gamescope on whyred.
#
# Gamescope's Wayland compositor hands Wayland clients a small surface
# (480x480) and RetroArch's native Wayland driver cannot negotiate a
# full-size window.  The SDL2 driver on Gamescope's Xwayland fills the
# output correctly.
video_driver = "sdl2"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
